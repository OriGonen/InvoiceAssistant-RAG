<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Assistant</title>
<script>
  // Apply a saved theme choice before the page paints, so it never flashes the wrong theme.
  // No saved choice -> no data-theme attribute -> the OS setting (prefers-color-scheme) decides.
  try {
    const saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch { /* storage blocked (e.g. private mode): just follow the OS */ }
</script>
<style>
  /* ---------- Theme tokens (light first, dark overrides below) ---------- */
  :root {
    color-scheme: light dark;
    --ground: #f5f6f8; --surface: #ffffff; --ink: #141821; --muted: #5b6475; --line: #dfe3ea;
    --accent: #2453d6; --accent-ink: #ffffff;
    /* The trace panel stays dark in both themes: it is "the machine's view". */
    --panel: #11151d; --panel-2: #1a202b; --panel-ink: #e6eaf2; --panel-muted: #9aa3b5; --panel-line: #2a3240;
    --tool: #8fb3ff; --ok: #6fd39a; --bad: #ff9d92;
    --warn-bg: #fff4d6; --warn-ink: #5c4500;
    --err: #a3261b; --err-bg: #fdecea;
    --sans: system-ui, "Segoe UI", -apple-system, Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  /* Dark tokens apply in two cases: the OS prefers dark and the user hasn't picked light,
     or the user picked dark with the toggle (data-theme on <html>). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0b0e13; --surface: #141922; --ink: #e8ecf3; --muted: #9aa3b5; --line: #262e3b;
      --accent: #7ea2ff; --accent-ink: #0b1430;
      --panel: #171d28; --panel-2: #1f2633; --panel-line: #313a4a;
      --warn-bg: #2e2610; --warn-ink: #f3d68a;
      --err: #ffaaa0; --err-bg: #2c1714;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0b0e13; --surface: #141922; --ink: #e8ecf3; --muted: #9aa3b5; --line: #262e3b;
    --accent: #7ea2ff; --accent-ink: #0b1430;
    --panel: #171d28; --panel-2: #1f2633; --panel-line: #313a4a;
    --warn-bg: #2e2610; --warn-ink: #f3d68a;
    --err: #ffaaa0; --err-bg: #2c1714;
  }
  /* Native controls (scrollbars, inputs) follow the chosen theme too. */
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  /* ---------- Page layout ---------- */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--sans); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 24px;
         border-bottom: 1px solid var(--line); background: var(--surface); }
  .logo { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 16px; font-weight: 650; }
  .logo svg { color: var(--accent); flex: none; }
  .banner { margin: 0 0 0 auto; font-size: 13px; padding: 4px 10px; border-radius: 999px;
            background: var(--warn-bg); color: var(--warn-ink); }
  .theme-toggle { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; cursor: pointer;
                  border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); }
  .theme-toggle:hover { border-color: var(--accent); }
  /* Show the moon in light mode (click = go dark) and the sun in dark mode. */
  .theme-toggle .sun { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .sun { display: block; }
    :root:not([data-theme="light"]) .theme-toggle .moon { display: none; }
  }
  :root[data-theme="dark"] .theme-toggle .sun { display: block; }
  :root[data-theme="dark"] .theme-toggle .moon { display: none; }

  /* Two columns on desktop; flex-wrap stacks the trace under the chat on narrow screens. */
  .wrap { display: flex; flex-wrap: wrap; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 24px; }
  .chat { flex: 999 1 520px; min-width: 0; }
  .trace { flex: 1 1 340px; min-width: 0; align-self: flex-start; background: var(--panel); color: var(--panel-ink);
           border-radius: 12px; padding: 20px; }
  @media (max-width: 520px) {
    .top, .wrap { padding-left: 16px; padding-right: 16px; }
    .banner { margin-left: 0; }
  }

  /* ---------- Question form ---------- */
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 10px;
          border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .send { min-height: 46px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent);
          color: var(--accent-ink); font: 600 15px var(--sans); cursor: pointer; }
  input:disabled, button:disabled { opacity: .6; cursor: progress; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 12px 0 24px; }
  .examples button { font: 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
                     border-radius: 999px; padding: 7px 12px; min-height: 36px; cursor: pointer; text-align: left; }
  .examples button:hover:not(:disabled) { border-color: var(--accent); }

  /* ---------- Conversation ---------- */
  .msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; overflow-wrap: anywhere; }
  .msg + .msg { margin-top: 12px; }
  .msg.user { background: transparent; border-style: dashed; }
  .who { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
  .answer p { margin: 0 0 8px; } .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 8px; padding-left: 22px; }
  .placeholder { color: var(--muted); margin: 0; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); min-height: 24px; margin: 0 0 12px; }
  .loading:empty { min-height: 0; margin: 0; }   /* stays in the DOM so aria-live keeps working */
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent);
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .err { margin-top: 12px; background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 14px 18px; }
  .err b { display: block; }

  /* ---------- Trace panel ---------- */
  .trace h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--panel-muted); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 20px; }
  .stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; margin: 0; }
  .stat dt { font-size: 11px; color: var(--panel-muted); text-transform: uppercase; letter-spacing: .08em; }
  .stat dd { margin: 0; font: 600 18px var(--mono); overflow-wrap: anywhere; }
  .stat .ok { color: var(--ok); } .stat .bad { color: var(--bad); }
  ol.steps { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.steps::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: var(--panel-line); }
  .step { position: relative; padding: 0 0 18px 36px; }
  .step:last-child { padding-bottom: 0; }
  .dot { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
         background: var(--panel-2); border: 2px solid var(--panel-line); font: 600 11px var(--mono); color: var(--panel-muted); }
  .step.call .dot { border-color: var(--tool); color: var(--tool); }
  .name { font: 600 14px var(--mono); color: var(--tool); overflow-wrap: anywhere; }
  .hint { font-size: 13px; color: var(--panel-muted); margin: 0; }
  pre { margin: 6px 0 0; padding: 10px 12px; background: var(--panel-2); border-radius: 8px;
        font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top">
  <h1 class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
    Invoice Assistant
  </h1>
  <p class="banner">Demo with sample data</p>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
    <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main class="wrap">
  <section class="chat" aria-label="Conversation">
    <form id="ask-form">
      <label class="vh" for="question">Ask about invoices or tax rules</label>
      <!-- maxlength is a convenience only; the server (Pydantic) is the real check -->
      <input id="question" name="question" maxlength="500" autocomplete="off" required
             placeholder="Ask about invoices or tax rules…">
      <button class="send" id="send" type="submit">Ask</button>
    </form>

    <ul class="examples" id="examples" aria-label="Example questions">
      <li><button type="button">Which invoices are overdue?</button></li>
      <li><button type="button">How much is still unpaid from invoices issued in September?</button></li>
      <li><button type="button">Who is our biggest client this year?</button></li>
      <li><button type="button">What is the standard VAT rate, and does Carol have overdue invoices?</button></li>
      <li><button type="button">What's the weather in Ljubljana?</button></li>
    </ul>

    <!-- aria-live: screen readers announce "Thinking…" without moving focus -->
    <p class="loading" id="loading" aria-live="polite"></p>

    <div id="conversation">
      <div class="msg"><p class="placeholder">Ask a question, or pick an example above. The agent's tool calls appear in the trace panel.</p></div>
    </div>

    <!-- role="alert": errors are announced immediately -->
    <div class="err" id="error" role="alert" hidden></div>
  </section>

  <aside class="trace" aria-label="Agent trace">
    <h2>Agent trace</h2>
    <dl class="stats">
      <div class="stat"><dt>Status</dt><dd id="stat-status">–</dd></div>
      <div class="stat"><dt>Rounds</dt><dd id="stat-rounds">–</dd></div>
      <div class="stat"><dt>Time</dt><dd id="stat-seconds">–</dd></div>
    </dl>
    <ol class="steps" id="steps">
      <li class="step"><span class="dot" aria-hidden="true">·</span><p class="hint">No question asked yet.</p></li>
    </ol>
  </aside>
</main>

<script>
"use strict";

/*
 * Structure: submit handler -> askServer() (fetch) -> renderSuccess() or showError().
 *
 * SECURITY: the answer and tool args come from an LLM, so they are untrusted.
 * Every piece of server/model text is put into the page with textContent or
 * createTextNode, never innerHTML, so it can never be parsed as HTML or run as script.
 */

const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const sendButton = document.getElementById("send");
const examples = document.getElementById("examples");
const loading = document.getElementById("loading");
const conversation = document.getElementById("conversation");
const errorBox = document.getElementById("error");
const steps = document.getElementById("steps");
const statStatus = document.getElementById("stat-status");
const statRounds = document.getElementById("stat-rounds");
const statSeconds = document.getElementById("stat-seconds");

let busy = false;      // guards against double submits while a request is in flight
let timerId = null;    // elapsed-seconds counter shown while waiting

// ---------- Small DOM helper: element with optional class and *text* (never HTML) ----------
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---------- Tiny markdown renderer (safe by construction) ----------
// Supports only what the agent produces: paragraphs, "* " / "- " bullet lists,
// "1. " numbered lists and **bold**.
// It never parses HTML: it splits the raw text and builds DOM nodes, putting every piece
// of text in with createTextNode. So "<img onerror=...>" in an answer stays literal text.
function renderMarkdown(text) {
  const fragment = document.createDocumentFragment();
  let paragraph = null;
  let list = null;

  for (const rawLine of text.split("\n")) {
    const line = rawLine.trim();
    const bullet = line.match(/^[*-]\s+(.*)$/);
    const numbered = line.match(/^\d+[.)]\s+(.*)$/);
    const item = bullet || numbered;
    const listTag = bullet ? "UL" : "OL";

    if (line === "") {               // blank line ends paragraphs (lists may continue past it)
      paragraph = null;
    } else if (item) {               // list item: reuse the open list if it's the same kind
      paragraph = null;
      if (!list || list.tagName !== listTag) { list = el(listTag.toLowerCase()); fragment.append(list); }
      const li = el("li");
      appendInline(li, item[1]);
      list.append(li);
    } else {                         // paragraph text; consecutive lines join with a line break
      list = null;
      if (paragraph) {
        paragraph.append(el("br"));
      } else {
        paragraph = el("p");
        fragment.append(paragraph);
      }
      appendInline(paragraph, line);
    }
  }
  return fragment;
}

// Splits on **bold** markers. With a capture group, split() returns
// [text, bold, text, bold, ...], so odd indexes are the bold parts.
function appendInline(parent, text) {
  text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
    if (part === "") return;
    parent.append(i % 2 === 1 ? el("strong", null, part) : document.createTextNode(part));
  });
}

// ---------- UI state ----------
function setBusy(isBusy) {
  busy = isBusy;
  input.disabled = isBusy;
  sendButton.disabled = isBusy;
  examples.querySelectorAll("button").forEach((b) => { b.disabled = isBusy; });

  clearInterval(timerId);
  loading.replaceChildren();
  if (isBusy) {
    const started = Date.now();
    const label = el("span", null, "Thinking…");
    loading.append(el("span", "spinner"), label);
    // Requests usually take 2–6 s but can take 20+ s, so show that something is happening.
    timerId = setInterval(() => {
      label.textContent = `Thinking… ${Math.round((Date.now() - started) / 1000)} s`;
    }, 1000);
  }
}

function showError(title, message) {
  errorBox.replaceChildren(el("b", null, title), document.createTextNode(message));
  errorBox.hidden = false;
}

function clearError() {
  errorBox.hidden = true;
  errorBox.replaceChildren();
}

function setStats(status, rounds, seconds, ok) {
  statStatus.textContent = status;
  statStatus.className = ok ? "ok" : "bad";
  statRounds.textContent = rounds;
  statSeconds.textContent = seconds;
}

function setTraceHint(text) {
  const li = el("li", "step");
  li.append(el("span", "dot", "·"), el("p", "hint", text));
  li.firstChild.setAttribute("aria-hidden", "true");
  steps.replaceChildren(li);
}

// ---------- Rendering a successful answer ----------
function userBubble(question) {
  const userMsg = el("div", "msg user");
  userMsg.append(el("p", "who", "You"), document.createTextNode(question));
  return userMsg;
}

function renderSuccess(question, data) {
  // The question bubble and the answer bubble.
  const userMsg = userBubble(question);

  const botMsg = el("div", "msg");
  const answer = el("div", "answer");
  answer.append(renderMarkdown(String(data.answer ?? "")));   // safe: DOM nodes + text only
  botMsg.append(el("p", "who", "Assistant"), answer);

  conversation.replaceChildren(userMsg, botMsg);

  setStats(data.status, data.rounds, `${Number(data.seconds).toFixed(1)} s`, data.status === "ok");

  // The trace: one numbered step per tool call, in the order the agent made them.
  const calls = Array.isArray(data.tool_calls) ? data.tool_calls : [];
  steps.replaceChildren();
  calls.forEach((call, i) => {
    const li = el("li", "step call");
    const dot = el("span", "dot", String(i + 1));
    dot.setAttribute("aria-hidden", "true");
    const args = el("pre", null, JSON.stringify(call.args ?? {}, null, 2));  // safe: textContent
    li.append(dot, el("div", "name", call.name), args);
    li.setAttribute("aria-label", `Tool call ${i + 1}: ${call.name}`);
    steps.append(li);
  });

  const last = el("li", "step");
  const tick = el("span", "dot", "✓");
  tick.setAttribute("aria-hidden", "true");
  last.append(tick, el("p", "hint", calls.length
    ? "Final answer written from the tool results."
    : "No tools called: the model answered directly."));
  steps.append(last);
}

// ---------- Turning an HTTP error into a readable message ----------
function describeError(status, body) {
  const detail = body && body.detail;
  if (status === 422) {
    // FastAPI validation errors: detail is a list of {loc, msg, type}. Join the msg fields.
    const msgs = Array.isArray(detail) ? detail.map((d) => d.msg).filter(Boolean) : [];
    return ["Invalid question (422).",
            (msgs.join("; ") || "The question was rejected") + ". Questions must be 1–500 characters."];
  }
  const text = typeof detail === "string" ? detail : "";
  if (status === 502) return ["The model call failed (502).", text || "The language model could not be reached. Try again in a moment."];
  if (status === 504) return ["The agent ran out of steps (504).", (text ? text + ". " : "") + "Try a simpler or more specific question."];
  return [`Server error (${status}).`, text || "Something went wrong on the server."];
}

// ---------- The request ----------
// Same-origin call: the page and the API are served by the same FastAPI app, so no CORS.
async function askServer(question) {
  let response;
  try {
    response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
  } catch {
    // fetch() only rejects when there is no HTTP response at all (server down, offline).
    return { ok: false, title: "Can't reach the server.", message: "Check that it is running (fastapi dev app/api.py) and try again." };
  }

  let body = null;
  try { body = await response.json(); } catch { /* non-JSON body: handled below via status */ }

  if (response.ok && body) return { ok: true, data: body };
  const [title, message] = describeError(response.status, body);
  return { ok: false, status: response.status, title, message };
}

// ---------- Submit handler ----------
form.addEventListener("submit", async (event) => {
  event.preventDefault();          // stay on the page; we send JSON with fetch instead
  if (busy) return;                // ignore double submits

  const question = input.value.trim();
  if (!question) {                 // client-side check is UX only; the server checks again
    showError("Please type a question.", "The question can't be empty.");
    input.focus();
    return;
  }

  clearError();
  // Clear the previous answer right away; only the new question shows while we wait.
  conversation.replaceChildren(userBubble(question));
  setBusy(true);
  const result = await askServer(question);
  setBusy(false);

  if (result.ok) {
    renderSuccess(question, result.data);
  } else {
    showError(result.title, result.message);
    setStats(result.status ? `${result.status}` : "error", "–", "–", false);
    setTraceHint("No trace: the request did not complete.");
  }
  input.focus();
});

// ---------- Light / dark toggle ----------
// The page follows the OS theme until the user clicks; then the choice is stored in
// localStorage and set as data-theme on <html>, which the CSS checks before the OS setting.
const themeToggle = document.getElementById("theme-toggle");
const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

function currentTheme() {
  return document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light");
}

function updateToggleLabel() {
  // The label says what a click will do, so screen readers announce the action.
  themeToggle.setAttribute("aria-label", currentTheme() === "dark" ? "Switch to light mode" : "Switch to dark mode");
}

themeToggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch { /* not saved; still applies for this visit */ }
  updateToggleLabel();
});
systemDark.addEventListener("change", updateToggleLabel);   // OS theme changed while the page is open
updateToggleLabel();

// ---------- Example questions: fill the input and submit ----------
examples.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button || busy) return;
  input.value = button.textContent;
  form.requestSubmit();            // goes through the same submit handler as Enter / Ask
});
</script>
</body>
</html>
